# Online edition of book/, published to GitHub Pages by .github/workflows/pages.yml.
# Local preview: pip install -r docs-site/requirements.txt && mkdocs serve
site_name: LLM 系列
site_url: https://zyaochen.github.io/llm-atlas/
site_description: 大模型学习系列：地基、系统、工程、场景四层 65 篇，从 token 到 Agent、从推理引擎到上线运维。
repo_url: https://github.com/zyaochen/llm-atlas
repo_name: zyaochen/llm-atlas
edit_uri: blob/main/book/
docs_dir: book
site_dir: site
copyright: <a href="https://zyaochen.github.io/">zyaochen</a> · MIT

theme:
  name: material
  custom_dir: docs-site/overrides
  language: zh
  features:
    - navigation.sections
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - search.highlight
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: blue
      toggle: { icon: material/weather-night, name: 切换到暗色 }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: blue
      toggle: { icon: material/weather-sunny, name: 切换到亮色 }
  font: false
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      # lunr.zh needs a server-side segmenter; split on every CJK character instead.
      lang: en
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])|(?<=[\u3400-\u9fff])|(?=[\u3400-\u9fff])'

hooks:
  - docs-site/hooks.py

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - admonition
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: math
          class: arithmatex
          format: !!python/object/apply:pymdownx.arithmatex.arithmatex_fenced_format {kwds: {mode: generic, tag: pre}}
  - pymdownx.arithmatex:
      generic: true
      inline_syntax: [round]
      block_syntax: [dollar, square]

extra:
  katex: true
  repo_prefix: "book"
  nav_stages:
    地基: 地基层 · 原理与数学
    系统: 系统层 · 训练、推理与部署
    工程: 工程层 · 把模型做成系统
    场景: 场景层 · 落到具体业务
    索引: 索引卷 · 跨层串读
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/zyaochen
